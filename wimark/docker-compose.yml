name: one
services:
  analytics-mw:
    image: repo.wimark.local:5000/backend/analytics-mw:1.9.2
    pull_policy: if_not_present
    restart:
      always
    sysctls:
    - net.ipv6.conf.all.disable_ipv6=1
    logging:
      driver: local
      options:
        mode: non-blocking
        max-buffer-size: 64m
        max-size: 995kb
        max-file: 20
    depends_on:
    - mosquitto
    environment:
    - BROKER_ADDR=tcp://mosquitto:1883
    - DB_ADDR=${DB_ADDR}
    - LOGLEVEL=0
    - SERVER_ADDR=:1333
