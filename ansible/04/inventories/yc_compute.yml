# inventories/yc_compute.yml
---
plugin: community.general.yc_compute

# Аутентификация
auth_kind: serviceaccountfile
service_account_file: "{{ lookup('env', 'YC_SA_KEY_PATH') | default('./sa-key.json') }}"

# Или для OAuth:
# auth_kind: oauth
# oauth_token: "{{ lookup('env', 'YC_ANSIBLE_OAUTH_TOKEN') }}"

# Список папок для сканирования
folders:
  - b1gxxxxxxxxxxxxx  # Замените на ваш folder_id
  - b1gyyyyyyyyyyyy

# Фильтрация инстансов
remote_filter: "labels.environment = 'production'"
filters:
  - status == 'RUNNING'
  - labels['managed_by'] == 'ansible'

# Определение хостнеймов (порядок важен!)
hostnames:
  - fqdn                    # Приоритет: FQDN
  - "{{ labels['hostname'] }}"  # Или кастомное поле из labels
  - public_ip              # fallback: публичный IP
  - private_ip             # fallback: приватный IP

# Динамические переменные для хостов
compose:
  ansible_host: >-
    network_interfaces[0].primary_v4_address.one_to_one_nat.address
    if network_interfaces[0].primary_v4_address.one_to_one_nat
    else network_interfaces[0].primary_v4_address.address
  ansible_user: "{{ labels['ssh_user'] | default('ubuntu') }}"
  yc_instance_id: id
  yc_folder_id: folder_id
  yc_zone: zone_id

# Группировка хостов
keyed_groups:
  - key: folder_id
    prefix: 'folder'
    separator: '_'
  - key: labels['role']
    prefix: 'role'
    separator: '_'
  - key: zone_id
    prefix: 'zone'
    separator: '_'

# Статические группы по условиям
groups:
  production: labels['environment'] == 'production'
  staging: labels['environment'] == 'staging'
  has_public_ip: network_interfaces[0].primary_v4_address.one_to_one_nat is defined

# Кэширование (опционально)
cache: true
cache_plugin: jsonfile
cache_connection: /tmp/yc_inventory_cache
cache_timeout: 300