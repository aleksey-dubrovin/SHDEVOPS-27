----
# Yandex.Cloud connection settings
yc_folder_id: "{{ lookup('env', 'YC_FOLDER_ID') | default('', true) }}"
yc_token: "{{ lookup('env', 'YC_TOKEN') | default('', true) }}"
yc_zone: "ru-central1-a"
yc_platform: "standard-v3"
yc_core_fraction: 100
yc_retry_count: 5
yc_retry_multiplayer: 2
yc_max_retries: 10

# Default VM settings
vm_user: "rocky"
vm_ssh_key_path: "~/.ssh/aleksey.pub"
vm_ssh_private_key_path: "~/.ssh/aleksey"
vm_wait_for_ssh: true
vm_ssh_timeout: 300
vm_ssh_delay: 10

# VM-specific settings (can be overridden)
clickhouse_vm:
  name: "clickhouse-01"
  cores: 4
  memory: 8
  disk_size: 30
  disk_type: "network-ssd"
  preemptible: false
  assign_public_ip: true

vector_vm:
  name: "vector-01"
  cores: 2
  memory: 4
  disk_size: 20
  disk_type: "network-ssd"
  preemptible: false
  assign_public_ip: true

lighthouse_vm:
  name: "lighthouse-01"
  cores: 2
  memory: 4
  disk_size: 20
  disk_type: "network-ssd"
  preemptible: false
  assign_public_ip: true

# Network settings
network_name: "logs-platform-network"
subnet_name: "public-subnet"
subnet_cidr: "192.168.72.0/24"

# Security groups
security_groups:
  clickhouse:
    name: "clickhouse-sg"
    rules:
      - direction: ingress
        protocol: TCP
        port: 22
        cidr: "0.0.0.0/0"
      - direction: ingress
        protocol: TCP
        port: 8123
        cidr: "0.0.0.0/0"
      - direction: ingress
        protocol: TCP
        port: 9000
        cidr: "0.0.0.0/0"
      - direction: ingress
        protocol: TCP
        port: 9009
        cidr: "{{ subnet_cidr }}"
  
  vector:
    name: "vector-sg"
    rules:
      - direction: ingress
        protocol: TCP
        port: 22
        cidr: "0.0.0.0/0"
  
  lighthouse:
    name: "lighthouse-sg"
    rules:
      - direction: ingress
        protocol: TCP
        port: 22
        cidr: "0.0.0.0/0"
      - direction: ingress
        protocol: TCP
        port: 80
        cidr: "0.0.0.0/0"