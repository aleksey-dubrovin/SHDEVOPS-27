---
- name: Create VM in Yandex Cloud
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    yc_token: "{{ lookup('env', 'YC_ANSIBLE_OAUTH_TOKEN') }}"
    yc_folder_id: "b1gxxxxxxxxxxxxx"
    yc_subnet_id: "e9bxxxxxxxxxxxxx"
    yc_image_id: "fd8xxxxxxxxxxxxx"  # Ubuntu 22.04

  tasks:
    - name: Create compute instance
      ycc_vm:
        token: "{{ yc_token }}"
        name: "ansible-test-vm"
        hostname: "test-vm"
        folder_id: "{{ yc_folder_id }}"
        zone_id: "ru-central1-a"
        platform_id: "Intel Cascade Lake"
        cores: 2
        core_fraction: 100
        memory: 4
        disk_type: "nvme"
        disk_size: 20
        image_id: "{{ yc_image_id }}"
        subnet_id: "{{ yc_subnet_id }}"
        assign_public_ip: true
        login: "ubuntu"
        public_ssh_key: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"
        preemptible: false
        state: present
      register: vm_result

    - name: Show VM info
      debug:
        var: vm_result