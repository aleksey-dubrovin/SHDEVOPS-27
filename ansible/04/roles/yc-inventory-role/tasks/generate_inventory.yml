---
- name: "Создание директории для инвентаря"
  ansible.builtin.file:
    path: "{{ inventory.file | dirname }}"
    state: directory
    mode: '0755'
  delegate_to: localhost
  when: inventory.file | dirname != '.'

- name: "Генерация inventory файла"
  ansible.builtin.template:
    src: inventory.j2
    dest: "{{ inventory.file }}"
    mode: '0644'
    backup: false
  delegate_to: localhost
  vars:
    groups: "{{ vm_groups }}"
    vm_details: "{{ vm_details }}"
    vm_user: "{{ default_vm.vm_user }}"
    ssh_key_path: "{{ default_vm.ssh_key_path }}"
    folder_id: "{{ yc_folder_id }}"
    subnet_name: "{{ default_vm.subnet_name }}"
    image_family: "{{ default_vm.image_family }}"

- name: "Создание локальной директории для group_vars"
  ansible.builtin.file:
    path: "{{ playbook_dir }}/roles/yc-inventory-role/group_vars"
    state: directory
    mode: '0755'
  delegate_to: localhost
  when: groups is defined and groups.keys() | length > 0

- name: "Создание group_vars файлов в локальной директории роли"
  ansible.builtin.copy:
    content: |
      ---
      # Group variables for {{ item }}
      # Generated by yc-inventory-role
      
      group_name: {{ item }}
      vm_count: {{ groups[item] | length }}
      vm_names: [{% for vm in groups[item] %}"{{ vm.name }}"{% if not loop.last %}, {% endif %}{% endfor %}]
      
      ansible_user: {{ default_vm.vm_user }}
      ansible_ssh_private_key_file: {{ default_vm.ssh_key_path | expanduser }}
    dest: "{{ playbook_dir }}/roles/yc-inventory-role/group_vars/{{ item }}.yml"
    mode: '0644'
  loop: "{{ groups.keys() | list }}"
  delegate_to: localhost
  when: 
    - inventory.create_group_vars
    - groups is defined
    - groups.keys() | length > 0
    - item not in ['all', 'ungrouped']