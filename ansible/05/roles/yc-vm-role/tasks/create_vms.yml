---
# ============================================
# ШАГ 1: Получение списка существующих ВМ
# ============================================
- name: "Получение списка существующих ВМ из Yandex Cloud"
  ansible.builtin.command: >
    {{ yc_cli_path }} compute instance list
    --folder-id {{ yc_folder_id }}
    --format json
  environment:
    YC_TOKEN: "{{ yc_token }}"
  register: existing_vms_list
  changed_when: false
  failed_when: false

- name: "Парсинг списка существующих ВМ"
  ansible.builtin.set_fact:
    existing_vms: "{{ existing_vms_list.stdout | from_json }}"
    existing_vm_names: "{{ existing_vms_list.stdout | from_json | map(attribute='name') | list }}"
  when: existing_vms_list.stdout | length > 0

- name: "Отладка: существующие ВМ"
  ansible.builtin.debug:
    msg:
      - "Существующие ВМ в Yandex Cloud: {{ existing_vm_names | join(', ') if existing_vm_names else 'нет' }}"
      - "Запрошенные ВМ в конфигурации: {{ vms_to_create | map(attribute='name') | join(', ') }}"

# ============================================
# ШАГ 2: Фильтрация ВМ для создания
# ============================================
- name: "Фильтрация ВМ для создания"
  ansible.builtin.set_fact:
    vms_to_create_filtered: "{{ vms_to_create | rejectattr('name', 'in', existing_vm_names) | list }}"

- name: "Информация о планируемых операциях"
  ansible.builtin.debug:
    msg:
      - "=================================================="
      - "ПЛАНИРУЕМЫЕ ОПЕРАЦИИ"
      - "=================================================="
      - "   Всего в списке: {{ vms_to_create | length }}"
      - "   Уже существуют: {{ existing_vm_names | join(', ') if existing_vm_names else 'нет' }}"
      - "   Будут созданы: {{ vms_to_create_filtered | map(attribute='name') | join(', ') if vms_to_create_filtered else 'нет' }}"
      - "=================================================="

# ============================================
# ШАГ 3: Создание ВМ (только тех, которых нет)
# ============================================
- name: "Создание виртуальных машин"
  ansible.builtin.command:
    cmd: >-
      {{ yc_cli_path }} compute instance create {{ item.name }}
      --folder-id {{ yc_folder_id }}
      --zone {{ item.zone | default(default_vm.zone) }}
      --platform {{ item.platform_id | default(default_vm.platform_id) }}
      --cores {{ item.cores | default(default_vm.cores) }}
      --memory {{ item.memory | default(default_vm.memory) }}
      --core-fraction {{ item.core_fraction | default(default_vm.core_fraction) }}
      --preemptible={{ item.preemptible | default(default_vm.preemptible) | string | lower }}
      --create-boot-disk name={{ item.name }}-boot,size={{ item.disk_size | default(default_vm.disk_size) }},type={{ item.disk_type | default(default_vm.disk_type) }},image-id={{ image_id }},auto-delete=true
      --network-interface subnet-id={{ subnet_id }}{% if item.assign_public_ip | default(default_vm.assign_public_ip) %},nat-ip-version=ipv4{% endif %}
      --metadata ssh-keys='{{ item.vm_user | default(default_vm.vm_user) }}:{{ lookup('file', (item.ssh_key_path | default(default_vm.ssh_key_path) + '.pub') | expanduser) | trim }}'
      {% if item.description is defined %}--description '{{ item.description }}'{% endif %}
      {% if item.labels is defined %}--labels {% for key, value in item.labels.items() %}{{ key }}={{ value }}{% if not loop.last %},{% endif %}{% endfor %}{% endif %}
      --format json
  environment:
    YC_TOKEN: "{{ yc_token }}"
  register: vm_create_result
  loop: "{{ vms_to_create_filtered }}"
  loop_control:
    label: "Создание {{ item.name }}"
  failed_when: false
  changed_when: vm_create_result.rc == 0
  when: vms_to_create_filtered | length > 0

# ============================================
# ШАГ 4: Итоговая статистика
# ============================================
- name: "Итоговая статистика"
  ansible.builtin.debug:
    msg:
      - "=================================================="
      - "РЕЗУЛЬТАТЫ СОЗДАНИЯ ВМ"
      - "=================================================="
      - "   Всего в списке: {{ vms_to_create | length }}"
      - "   Уже существовали: {{ existing_vm_names | length if existing_vm_names else 0 }}"
      - "   Создано сейчас: {{ vm_create_result.results | selectattr('rc', 'equalto', 0) | list | length if vm_create_result.results is defined else 0 }}"
      - "   Ошибки: {{ vm_create_result.results | selectattr('rc', 'equalto', 1) | list | length if vm_create_result.results is defined else 0 }}"
      - "=================================================="

# ============================================
# ШАГ 5: Сохранение информации о созданных ВМ
# ============================================
- name: "Сохранение информации о созданных ВМ"
  ansible.builtin.set_fact:
    created_vms: "{{ created_vms | default([]) + [{
      'name': item.item.name,
      'group': item.item.group,
      'result': item.stdout | from_json,
      'config': item.item,
      'status': 'created'
    }] }}"
  loop: "{{ vm_create_result.results | default([]) }}"
  loop_control:
    label: "Сохранение {{ item.item.name }}"
  when: 
    - item.rc == 0
    - item.stdout is defined
    - item.stdout | length > 0