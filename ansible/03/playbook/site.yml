- name: Install and configure ClickHouse on Rocky Linux
  hosts: clickhouse
  become: true
  vars_files:
    - group_vars/clickhouse/vars.yml
  tags: [clickhouse, db]
  
  handlers:
    - name: restart clickhouse
      ansible.builtin.systemd:
        name: clickhouse-server
        state: restarted
        daemon_reload: true
        enabled: true
      listen: "restart clickhouse"

  tasks:
    - name: Set facts for Rocky Linux
      ansible.builtin.set_fact:
        package_manager: dnf
        python_interpreter: /usr/bin/python3
      tags: always

    - name: Install EPEL repository
      ansible.builtin.dnf:
        name: epel-release
        state: present
        update_cache: true
      tags: [clickhouse, repo]

    - name: Install required system packages
      ansible.builtin.dnf:
        name:
          - curl
          - wget
          - python3
          - python3-pip
          - python3-libselinux
          - policycoreutils-python-utils
          - unzip
          - tar
          - xz
          - ca-certificates
          - gnupg2
        state: present
        update_cache: true
      tags: [clickhouse, packages]

    - name: Create directory for ClickHouse RPMs on target
      ansible.builtin.file:
        path: /tmp/clickhouse-rpms
        state: directory
        mode: '0755'
      tags: [clickhouse, prepare]

    - name: Copy ClickHouse RPMs to remote server
      ansible.builtin.copy:
        src: "{{ item }}"  # Убрали "clickhouse-rpms/" из пути
        dest: "/tmp/clickhouse-rpms/{{ item }}"
        mode: '0644'
      loop: "{{ clickhouse_packages }}"
      tags: [clickhouse, copy]
      when: not ansible_check_mode

    - name: Install ClickHouse RPMs from local files
      ansible.builtin.dnf:
        name: "/tmp/clickhouse-rpms/{{ item }}"
        state: present
        disable_gpg_check: true
      loop: "{{ clickhouse_packages }}"
      tags: [clickhouse, install]
      notify: restart clickhouse
      register: install_result

    - name: Create ClickHouse data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: clickhouse
        group: clickhouse
        mode: '0755'
      loop:
        - /var/lib/clickhouse
        - /var/log/clickhouse-server
      tags: [clickhouse, directories]

    - name: Configure SELinux for ClickHouse
      ansible.builtin.command:
        cmd: semanage port -a -t http_port_t -p tcp 8123
      register: selinux_result
      failed_when: selinux_result.rc != 0 and 'already defined' not in selinux_result.stderr
      changed_when: selinux_result.rc == 0
      tags: [clickhouse, selinux]
      ignore_errors: true

    - name: Configure ClickHouse for network access
      ansible.builtin.template:
       src: templates/clickhouse/config.xml.j2
       dest: "{{ clickhouse_config_path }}"
       owner: clickhouse
       group: clickhouse
       mode: '0644'
       backup: true
      tags: [clickhouse, configure]
      notify: restart clickhouse

    - name: Configure firewall for ClickHouse
      ansible.builtin.firewalld:
        port: "{{ item }}/tcp"
        permanent: true
        state: enabled
        immediate: true
      loop:
        - 8123
        - 9000
        - 9009
      when: ansible_facts.services['firewalld'] is defined and ansible_facts.services['firewalld'].state == 'running'
      tags: [clickhouse, firewall]
      ignore_errors: true

    - name: Start and enable ClickHouse service
      ansible.builtin.systemd:
        name: clickhouse-server
        state: started
        enabled: true
        daemon_reload: true
      tags: [clickhouse, service]

    - name: Wait for ClickHouse to become available
      ansible.builtin.wait_for:
        port: 8123
        host: "{{ ansible_default_ipv4.address }}"
        delay: 5
        timeout: 60
        connect_timeout: 5
      tags: [clickhouse, wait]

    - name: Create database using clickhouse-client
      ansible.builtin.shell: |
        set -e
        for i in {1..10}; do
          if clickhouse-client -q "CREATE DATABASE IF NOT EXISTS {{ clickhouse_database }};" 2>/dev/null; then
            echo "Database {{ clickhouse_database }} created or already exists"
            exit 0
          fi
          echo "Attempt $i: ClickHouse not ready, waiting..."
          sleep 3
        done
        echo "Failed to create database after 10 attempts"
        exit 1
      args:
        executable: /bin/bash
      register: db_create
      changed_when: "'created' in db_create.stdout"
      failed_when: db_create.rc != 0
      tags: [clickhouse, database]
      when: not ansible_check_mode

    - name: Verify ClickHouse installation
      ansible.builtin.command:
        cmd: clickhouse-client --query "SELECT version();"
      register: ch_ver
      changed_when: false
      tags: [clickhouse, verify]

    - name: Display ClickHouse version
      ansible.builtin.debug:
        msg: "ClickHouse version: {{ ch_ver.stdout }}"
      tags: [clickhouse, verify]

    - name: Cleanup temporary RPM files
      ansible.builtin.file:
        path: /tmp/clickhouse-rpms
        state: absent
      tags: [clickhouse, cleanup]
      when: not ansible_check_mode

- name: Install and configure Vector on Rocky Linux
  hosts: vector
  become: true
  vars_files:
    - group_vars/vector/vars.yml
  tags: [vector, logs]
  
  handlers:
    - name: restart vector
      ansible.builtin.systemd:
        name: vector
        state: restarted
        daemon_reload: true
        enabled: true
      listen: "restart vector"

  tasks:
    - name: Update all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true
      tags: [vector, update]

    - name: Install required system packages
      ansible.builtin.dnf:
        name:
          - curl
          - wget
          - python3
          - python3-pip
          - python3-libselinux
          - policycoreutils-python-utils
        state: present
        update_cache: true
      tags: [vector, packages]

    - name: Download Vector RPM
      ansible.builtin.get_url:
        url: "https://packages.timber.io/vector/{{ vector_version }}/vector-{{ vector_version }}-1.x86_64.rpm"
        dest: "/tmp/vector-{{ vector_version }}.rpm"
        mode: '0644'
        validate_certs: true
        timeout: 30
      tags: [vector, download]
      register: vector_download
      until: vector_download is success
      retries: 5
      delay: 10

    - name: Install Vector on Rocky Linux
      ansible.builtin.dnf:
        name: "/tmp/vector-{{ vector_version }}.rpm"
        state: present
        disable_gpg_check: true
        update_cache: true
      tags: [vector, install]
      notify: restart vector

    - name: Create Vector user if not exists
      ansible.builtin.user:
        name: vector
        system: true
        shell: /sbin/nologin
        create_home: false
      tags: [vector, user]

    - name: Add vector user to adm group for log access
      ansible.builtin.user:
        name: vector
        groups: adm
        append: yes
      tags: [vector, permissions]

    - name: Ensure Vector directories exist with correct permissions
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: vector
        group: vector
        mode: '0755'
      loop:
        - "{{ vector_data_dir }}"
        - /etc/vector
      tags: [vector, directories]

    - name: Configure Vector with YAML format
      ansible.builtin.template:
        src: templates/vector/vector.yaml.j2  # Изменено с .toml.j2 на .yaml.j2
        dest: "{{ vector_config_path }}"
        owner: vector
        group: vector
        mode: '0644'
        backup: true
      tags: [vector, configure]
      notify: restart vector

    - name: Create systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/vector.service.d
        state: directory
        mode: '0755'
      tags: [vector, systemd]

    - name: Create systemd override to use YAML config
      ansible.builtin.copy:
        content: |
          [Service]
          ExecStartPre=
          ExecStartPre=/usr/bin/vector validate --config-yaml {{ vector_config_path }} --no-environment
          ExecStart=
          ExecStart=/usr/bin/vector --config-yaml {{ vector_config_path }}
        dest: /etc/systemd/system/vector.service.d/override.conf
        mode: '0644'
      tags: [vector, systemd]
      notify: restart vector

    - name: Ensure log files have correct permissions
      ansible.builtin.file:
        path: "{{ item }}"
        mode: '0640'
        owner: root
        group: adm
      loop:
        - /var/log/messages
        - /var/log/secure
      tags: [vector, permissions]
      ignore_errors: true

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true
      tags: [vector, systemd]

    - name: Start and enable Vector service
      ansible.builtin.systemd:
        name: vector
        state: started
        enabled: true
        daemon_reload: true
      tags: [vector, service]
      register: vector_start

    - name: Verify Vector is running
      ansible.builtin.command:
        cmd: systemctl is-active vector
      changed_when: false
      register: vector_status
      failed_when: vector_status.stdout != "active"
      tags: [vector, verify]

    - name: Display Vector status
      ansible.builtin.debug:
        msg: "Vector is successfully installed and running"
      tags: [vector, verify]

    - name: Cleanup temporary Vector RPM
      ansible.builtin.file:
        path: "/tmp/vector-{{ vector_version }}.rpm"
        state: absent
      tags: [vector, cleanup]
      when: not ansible_check_mode

- name: Install and configure Lighthouse on Rocky Linux
  hosts: lighthouse
  become: true
  vars_files:
    - group_vars/lighthouse/vars.yml
  tags: [lighthouse, web]
  
  handlers:
    - name: restart nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
        enabled: true
      listen: "restart nginx"

  tasks:
    - name: Update all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true
      tags: [lighthouse, update]

    - name: Install EPEL repository
      ansible.builtin.dnf:
        name: epel-release
        state: present
        update_cache: true
      tags: [lighthouse, repo]

    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - nginx
          - git
          - python3
          - python3-pip
          - python3-libselinux
          - policycoreutils-python-utils
          - firewalld
        state: present
        update_cache: true
      tags: [lighthouse, packages]

    - name: Start and enable firewalld
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: true
      tags: [lighthouse, firewall]
      register: firewalld_start

    - name: Wait for firewalld to be ready
      ansible.builtin.pause:
        seconds: 3
      when: firewalld_start.changed
      tags: [lighthouse, firewall]

    - name: Configure git safe directory
      ansible.builtin.command:
        cmd: git config --global --add safe.directory {{ lighthouse_path }}
      become: yes
      become_user: root
      tags: [lighthouse, git]
      changed_when: false
      ignore_errors: true

    - name: Remove existing Lighthouse directory if it exists
      ansible.builtin.file:
        path: "{{ lighthouse_path }}"
        state: absent
      tags: [lighthouse, cleanup]
      when: not ansible_check_mode

    - name: Clone Lighthouse repository
      ansible.builtin.git:
        repo: "{{ lighthouse_repo }}"
        dest: "{{ lighthouse_path }}"
        version: "{{ lighthouse_version }}"
        force: true
        depth: 1
        accept_hostkey: true
      tags: [lighthouse, git]
      register: git_result
      until: git_result is success
      retries: 5
      delay: 10

    - name: Set ownership of Lighthouse files for nginx
      ansible.builtin.file:
        path: "{{ lighthouse_path }}"
        owner: nginx
        group: nginx
        recurse: true
      tags: [lighthouse, permissions]

    - name: Configure SELinux for nginx
      ansible.builtin.command:
        cmd: setsebool -P httpd_can_network_connect on
      register: selinux_nginx
      changed_when: selinux_nginx.rc == 0
      tags: [lighthouse, selinux]
      ignore_errors: true

    - name: Configure nginx for Lighthouse
      ansible.builtin.template:
        src: templates/nginx/lighthouse.conf.j2
        dest: "{{ nginx_config_path }}"
        mode: '0644'
        backup: true
      tags: [lighthouse, nginx]
      notify: restart nginx

    - name: Remove default nginx config
      ansible.builtin.file:
        path: /etc/nginx/conf.d/default.conf
        state: absent
      tags: [lighthouse, nginx]
      notify: restart nginx
      ignore_errors: true

    - name: Configure firewall for nginx
      ansible.builtin.firewalld:
        service: "{{ item }}"
        permanent: true
        state: enabled
        immediate: true
      loop:
        - http
        - https
      tags: [lighthouse, firewall]
      when: firewalld_start is success

    - name: Start and enable nginx service
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true
      tags: [lighthouse, service]

    - name: Verify Lighthouse is accessible
      ansible.builtin.uri:
        url: "http://{{ ansible_default_ipv4.address }}"
        method: GET
        status_code: 200
        timeout: 10
      register: lighthouse_check
      failed_when: lighthouse_check.status != 200
      tags: [lighthouse, verify]
      when: not ansible_check_mode