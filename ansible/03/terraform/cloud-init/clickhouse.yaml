#cloud-config
users:
  - name: rocky
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - git
  - vim
  - htop
  - net-tools
  - bind-utils
  - telnet
  - python3
  - python3-pip
  - policycoreutils-python-utils
  - setroubleshoot
  - fail2ban
  - firewalld

write_files:
  - path: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime = 3600
      findtime = 600
      maxretry = 5
      
      [sshd]
      enabled = true
      port = ssh
      filter = sshd
      logpath = /var/log/secure

  - path: /etc/sysctl.d/99-clickhouse.conf
    content: |
      # ClickHouse tuning
      vm.max_map_count = 1048575
      fs.file-max = 1048575
      kernel.pid_max = 1048575

  - path: /etc/security/limits.d/clickhouse.conf
    content: |
      clickhouse soft nofile 1048575
      clickhouse hard nofile 1048575
      clickhouse soft nproc 1048575
      clickhouse hard nproc 1048575

runcmd:
  # Настройка hostname
  - hostnamectl set-hostname clickhouse-01
  
  # Настройка firewall
  - systemctl enable --now firewalld
  - firewall-cmd --permanent --add-service=ssh
  - firewall-cmd --permanent --add-port=8123/tcp
  - firewall-cmd --permanent --add-port=9000/tcp
  - firewall-cmd --reload
  
  # Настройка SELinux (более мягкий режим)
  - setenforce 0
  - sed -i 's/^SELINUX=enforcing/SELINUX=permissive/' /etc/selinux/config
  
  # Настройка fail2ban
  - systemctl enable --now fail2ban
  
  # Применение sysctl настроек
  - sysctl -p /etc/sysctl.d/99-clickhouse.conf
  
  # Создание директорий для ClickHouse
  - mkdir -p /var/lib/clickhouse /var/log/clickhouse-server
  - chown -R clickhouse:clickhouse /var/lib/clickhouse /var/log/clickhouse-server 2>/dev/null || true
  
  # Настройка времени
  - timedatectl set-timezone Europe/Moscow
  - systemctl enable --now chronyd
  
  # Оптимизация системы
  - echo "never" > /sys/kernel/mm/transparent_hugepage/enabled
  
  # Метка для inventory
  - echo "CLICKHOUSE_VM=ready" > /etc/vm_metadata

final_message: "ClickHouse VM is fully provisioned after $UPTIME seconds"