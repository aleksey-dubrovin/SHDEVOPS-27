#cloud-config
users:
  - name: rocky
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - git
  - vim
  - htop
  - net-tools
  - bind-utils
  - telnet
  - python3
  - python3-pip
  - policycoreutils-python-utils
  - fail2ban
  - firewalld

write_files:
  - path: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime = 3600
      findtime = 600
      maxretry = 5
      
      [sshd]
      enabled = true

  - path: /etc/vector/vector.toml
    content: |
      [sources.local_logs]
        type = "file"
        include = ["/var/log/*.log", "/var/log/messages"]
        read_from = "beginning"
      
      [sinks.console]
        type = "console"
        inputs = ["local_logs"]
        encoding.codec = "json"

runcmd:
  # Настройка hostname
  - hostnamectl set-hostname vector-01
  
  # Настройка firewall
  - systemctl enable --now firewalld
  - firewall-cmd --permanent --add-service=ssh
  - firewall-cmd --reload
  
  # Настройка SELinux
  - setenforce 0
  - sed -i 's/^SELINUX=enforcing/SELINUX=permissive/' /etc/selinux/config
  
  # Настройка fail2ban
  - systemctl enable --now fail2ban
  
  # Настройка времени
  - timedatectl set-timezone Europe/Moscow
  - systemctl enable --now chronyd
  
  # Подготовка директорий для Vector
  - mkdir -p /etc/vector
  - chown -R vector:vector /etc/vector 2>/dev/null || true
  
  # Метка для inventory
  - echo "VECTOR_VM=ready" > /etc/vm_metadata

final_message: "Vector VM is fully provisioned after $UPTIME seconds"