#cloud-config
users:
  - name: rocky
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}

package_update: true
package_upgrade: true

packages:
  - curl
  - wget
  - git
  - vim
  - htop
  - net-tools
  - bind-utils
  - telnet
  - nginx
  - python3
  - python3-pip
  - policycoreutils-python-utils
  - fail2ban
  - firewalld
  - epel-release

write_files:
  - path: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime = 3600
      findtime = 600
      maxretry = 5
      
      [sshd]
      enabled = true
      
      [nginx-http-auth]
      enabled = true

  - path: /etc/nginx/conf.d/lighthouse.conf
    content: |
      server {
          listen 80;
          server_name _;
          root /var/www/lighthouse;
          index index.html;
          
          access_log /var/log/nginx/lighthouse_access.log;
          error_log /var/log/nginx/lighthouse_error.log;
          
          location / {
              try_files $uri $uri/ =404;
          }
      }

runcmd:
  # Настройка hostname
  - hostnamectl set-hostname lighthouse-01
  
  # Настройка firewall
  - systemctl enable --now firewalld
  - firewall-cmd --permanent --add-service=ssh
  - firewall-cmd --permanent --add-service=http
  - firewall-cmd --permanent --add-service=https
  - firewall-cmd --reload
  
  # Настройка SELinux
  - setenforce 0
  - sed -i 's/^SELINUX=enforcing/SELINUX=permissive/' /etc/selinux/config
  - setsebool -P httpd_can_network_connect on
  
  # Настройка fail2ban
  - systemctl enable --now fail2ban
  
  # Настройка времени
  - timedatectl set-timezone Europe/Moscow
  - systemctl enable --now chronyd
  
  # Клонирование Lighthouse
  - git clone https://github.com/VKCOM/lighthouse.git /var/www/lighthouse
  - chown -R nginx:nginx /var/www/lighthouse
  
  # Запуск nginx
  - systemctl enable --now nginx
  
  # Метка для inventory
  - echo "LIGHTHOUSE_VM=ready" > /etc/vm_metadata

final_message: "Lighthouse VM is fully provisioned after $UPTIME seconds"