#cloud-config
package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - software-properties-common
  - git
  - python3-pip

runcmd:
  # Установка Docker
  - curl -fsSL https://get.docker.com -o get-docker.sh
  - sh get-docker.sh
  
  # Установка Docker Compose
  - curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
  - chmod +x /usr/local/bin/docker-compose
  
  # Добавление пользователя в группу docker
  - usermod -aG docker ubuntu
  
  # Создание директории для приложения
  - mkdir -p /opt/app
  
  # Клонирование репозитория с приложением
  - git clone https://github.com/netology-code/shvirtd-example-python.git /opt/app
  
  # Создание .env файла с переменными для подключения к БД
  - echo "DB_HOST=${mysql_host}" > /opt/app/.env
  - echo "DB_USER=${mysql_user}" >> /opt/app/.env
  - echo "DB_PASSWORD=${mysql_password}" >> /opt/app/.env
  - echo "DB_NAME=${mysql_database}" >> /opt/app/.env
  - echo "DB_PORT=3306" >> /opt/app/.env
  
  # Копирование docker-compose.yml из папки app если нужно
  - cp /opt/app/docker-compose.yml /opt/app/docker-compose.yml.bak 2>/dev/null || true
  
  # Запуск приложения
  - cd /opt/app && docker-compose up -d

final_message: "Docker and Docker Compose installed successfully after $UPTIME seconds"