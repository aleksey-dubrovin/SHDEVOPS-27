spec:
  containers:
  - image: cr.yandex/${registry_id}/shvirtd-app:${app_image_tag}
    name: shvirtd-app
    ports:
    - containerPort: 5000
      hostPort: 80
      protocol: TCP
    env:
    - name: DB_HOST
      value: ${db_host}
    - name: DB_USER
      value: ${db_user}
    - name: DB_PASSWORD
      value: ${db_password}
    - name: DB_NAME
      value: ${db_name}
    - name: DB_PORT
      value: "3306"
    restartPolicy: Always
    stdin: false
    tty: false
    securityContext:
      privileged: false